<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Medicare – AI-powered rural telehealth platform connecting patients with verified doctors, symptom analysis, and emergency services." />
  <meta name="theme-color" content="#0d9488" />
  <title>Medicare – Rural Telehealth Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/index.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/screens.css" />
</head>

<body>
  <div id="app">
    <!-- Loading splash -->
    <div id="splash-screen" class="splash">
      <div class="splash-content">
        <div class="splash-logo">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect width="64" height="64" rx="16" fill="url(#grad1)" />
            <path d="M32 16v32M16 32h32" stroke="#fff" stroke-width="5" stroke-linecap="round" />
            <defs>
              <linearGradient id="grad1" x1="0" y1="0" x2="64" y2="64">
                <stop stop-color="#14b8a6" />
                <stop offset="1" stop-color="#0891b2" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="splash-title">Medicare</h1>
        <p class="splash-subtitle">Rural Telehealth Platform</p>
        <div class="splash-loader">
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>
    <!-- Main app container -->
    <div id="app-container" class="app-container hidden">
      <main id="screen-container" class="screen-container"></main>
      <nav id="bottom-nav" class="bottom-nav hidden">
        <button class="nav-item" data-route="dashboard">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span data-i18n="nav_home">Home</span>
        </button>
        <button class="nav-item" data-route="symptom-checker">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          <span data-i18n="nav_symptoms">Symptoms</span>
        </button>
        <button class="nav-item sos-nav" data-route="emergency-sos">
          <div class="sos-icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
              <line x1="12" y1="9" x2="12" y2="13" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          </div>
          <span>SOS</span>
        </button>
        <button class="nav-item" data-route="doctor-list">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 00-3-3.87" />
            <path d="M16 3.13a4 4 0 010 7.75" />
          </svg>
          <span data-i18n="nav_doctors">Doctors</span>
        </button>
        <button class="nav-item" data-route="patient-profile">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span data-i18n="nav_profile">Profile</span>
        </button>
        <button class="nav-item" data-route="medical-records">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
          <span data-i18n="nav_records">Records</span>
        </button>
      </nav>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
